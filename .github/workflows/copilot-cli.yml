# This is a basic workflow to help you get started with Actions

name: Copilot CLI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      # Install Copilot CLI
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # Create MCP config file
      - name: Create MCP Config
        run: |
          mkdir -p ~/.copilot
          cp mcp-servers.json ~/.copilot/mcp-servers.json
      
      # show installed MCP servers
      - name: Show MCP Servers
        run: cat ~/.copilot/mcp-servers.json 

      # Interact with public repos
      - name: Public Repos
        run: |
          copilot -p "which public GitHub repos do I have access to?" --allow-all-tools
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      # Interact with private repos
      - name: Private Repos
        run: |
          copilot -p "which private GitHub repos do I have access to?" --allow-all-tools
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}